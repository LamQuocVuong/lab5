name: GoRest API Monitor

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Check GoRest API response time
        shell: bash
        run: |
          set -euo pipefail
          result=$(curl --silent --show-error --output /dev/null \
            --write-out '%{http_code} %{time_total}' \
            'https://gorest.co.in/public/v2/users')
          status=$(echo "$result" | awk '{print $1}')
          seconds=$(echo "$result" | awk '{print $2}')
          echo "HTTP status: $status"
          echo "Response time: ${seconds}s"
          if [ "$status" -ne 200 ]; then
            echo "Monitor failed: expected HTTP 200."
            exit 1
          fi
          awk -v t="$seconds" 'BEGIN { if (t >= 0.8) { print "Monitor failed: response time must be under 800ms."; exit 1 } else { print "Monitor passed: response time is under 800ms." } }'
