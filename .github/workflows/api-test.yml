name: GoRest API Tests

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  api-testing:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Newman
        run: npm install -g newman
      - name: Run GoRest Postman collection
        env:
          GOREST_TOKEN: ${{ secrets.GOREST_TOKEN }}
        run: |
          if [ -z "$GOREST_TOKEN" ]; then
            echo "Missing GitHub Secret: GOREST_TOKEN"
            exit 1
          fi
          newman run Collection.json \
            -e Environment.json \
            -d users.csv \
            --env-var "token=$GOREST_TOKEN" \
            --reporters cli
